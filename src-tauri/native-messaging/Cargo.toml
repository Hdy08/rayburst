[package]
name = "rayburst-browser-launcher"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry"] }

[lints.clippy]
unwrap_used = "deny"

[[bin]]
name = "rayburst-browser-manifests"
path = "src/manifests.rs"
